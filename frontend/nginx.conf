# ============================================================
# frontend/nginx.conf - Configuración de Nginx
# Reverse proxy + servidor de archivos estáticos
# ============================================================

server {
    # Puerto de escucha
    listen 80;
    server_name localhost;
    
    # Directorio raíz de archivos estáticos
    root /usr/share/nginx/html;
    index index.html;
    
    # ----------------------------------------------------------
    # Headers de seguridad
    # ----------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    
    # ----------------------------------------------------------
    # Gzip - Compresión de respuestas
    # ----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    
    # ----------------------------------------------------------
    # Ubicación principal - Servir archivos estáticos
    # ----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # ----------------------------------------------------------
    # Reverse Proxy hacia el Backend (FastAPI)
    # ----------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
    
    # ----------------------------------------------------------
    # Documentación de la API (Swagger/ReDoc)
    # ----------------------------------------------------------
    location /docs {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    
    location /redoc {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    
    location /openapi.json {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    
    # ----------------------------------------------------------
    # Health check del backend
    # ----------------------------------------------------------
    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    
    # ----------------------------------------------------------
    # Cache para assets estáticos (CSS, JS, imágenes)
    # ----------------------------------------------------------
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # ----------------------------------------------------------
    # No cachear HTML (siempre servir la última versión)
    # ----------------------------------------------------------
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # ----------------------------------------------------------
    # Bloquear acceso a archivos ocultos
    # ----------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # ----------------------------------------------------------
    # Manejo de errores personalizados
    # ----------------------------------------------------------
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
