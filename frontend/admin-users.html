<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - SPA Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
</head>
<body>
    <div id="app" class="app-layout">
        <!-- Sidebar -->
        <!-- Sidebar se inyecta dinámicamente -->
        <div id="sidebar-container"></div>
        
        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <header class="main-header">
                <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">☰</button>
                <div class="search-bar">
                    <span class="search-icon">🔍</span>
                    <input type="text" placeholder="Buscar..." aria-label="Buscar">
                </div>
                <div class="header-actions">
                    <button class="notification-btn" aria-label="Notificaciones">
                        🔔
                        <span class="notification-badge">3</span>
                    </button>
                </div>
            </header>
            
            <!-- Page Content -->
            <main class="page-content">
                <!-- Page Header -->
                <div class="page-header">
                    <div>
                        <h1 class="page-title">Usuarios</h1>
                        <p class="page-subtitle">Gestiona todos los usuarios del sistema</p>
                    </div>
                    <button class="btn btn-primary" id="btnNewUser">+ Nuevo Usuario</button>
                </div>
                
                <!-- Search and Filter -->
                <div class="filter-bar">
                    <div class="search-input-wrapper">
                        <span class="search-icon">🔍</span>
                        <input type="text" class="search-input" id="searchUsers" placeholder="Buscar por nombre, email o usuario...">
                    </div>
                    <select class="form-select" id="filterRole">
                        <option value="">Todos los roles</option>
                        <option value="superadmin">Super Administrador</option>
                        <option value="admin">Administrador</option>
                        <option value="manager">Gerente</option>
                        <option value="receptionist">Recepcionista</option>
                        <option value="therapist">Terapeuta</option>
                    </select>
                </div>
                
                <!-- Users Grid -->
                <div class="users-grid" id="usersGrid">
                    <!-- Se llena dinámicamente -->
                </div>
            </main>
        </div>
    </div>
    
    <!-- Modal Nuevo Usuario -->
    <div class="modal-overlay" id="newUserModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Nuevo Usuario</h2>
                <p>Agrega un nuevo miembro al equipo</p>
            </div>
            <div class="modal-body">
                <form id="newUserForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Nombre *</label>
                            <input type="text" id="userNombre" required placeholder="María">
                        </div>
                        <div class="form-group">
                            <label>Apellido *</label>
                            <input type="text" id="userApellido" required placeholder="González">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Usuario *</label>
                        <input type="text" id="userUsername" required placeholder="maria.gonzalez">
                    </div>
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="userEmail" required placeholder="maria@spa.com">
                    </div>
                    <div class="form-group">
                        <label>Contraseña *</label>
                        <input type="password" id="userPassword" required placeholder="Mínimo 8 caracteres" minlength="8">
                    </div>
                    <div class="form-group">
                        <label>Rol *</label>
                        <select id="userRol" class="form-select" required>
                            <option value="admin">Administrador</option>
                            <option value="manager">Gerente</option>
                            <option value="receptionist">Recepcionista</option>
                            <option value="therapist">Terapeuta</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelUser">Cancelar</button>
                <button class="btn btn-primary" id="saveUser">Crear Usuario</button>
            </div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/admin-users.js"></script>
</body>
</html>
