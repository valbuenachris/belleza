<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citas - SPA Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
</head>
<body>
    <div id="app" class="app-layout">
        <!-- Sidebar se inyecta dinámicamente -->
        <div id="sidebar-container"></div>
        
        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <header class="main-header">
                <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">☰</button>
                <div class="search-bar">
                    <span class="search-icon">🔍</span>
                    <input type="text" placeholder="Buscar..." aria-label="Buscar">
                </div>
                <div class="header-actions">
                    <button class="notification-btn" aria-label="Notificaciones">
                        🔔
                        <span class="notification-badge">3</span>
                    </button>
                </div>
            </header>
            
            <!-- Page Content -->
            <main class="page-content">
                <!-- Page Header -->
                <div class="page-header">
                    <div>
                        <h1 class="page-title">Citas</h1>
                        <p class="page-subtitle">Gestiona todas las citas y reservas</p>
                    </div>
                    <button class="btn btn-primary" id="btnNewAppointment">+ Nueva Cita</button>
                </div>
                
                <!-- Filters -->
                <div class="filter-bar">
                    <div class="search-input-wrapper">
                        <span class="search-icon">🔍</span>
                        <input type="text" class="search-input" id="searchAppointments" placeholder="Buscar por paciente o servicio...">
                    </div>
                    <input type="date" class="form-select" id="filterDate">
                    <select class="form-select" id="filterStatus">
                        <option value="">Todos los estados</option>
                        <option value="confirmed">Confirmada</option>
                        <option value="pending">Pendiente</option>
                        <option value="cancelled">Cancelada</option>
                        <option value="completed">Completada</option>
                    </select>
                </div>
                
                <!-- Stats Cards -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-content">
                            <p class="stat-label">Citas Hoy</p>
                            <p class="stat-value" id="statToday">12</p>
                            <p class="stat-change positive">↗ +23% vs ayer</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-content">
                            <p class="stat-label">Esta Semana</p>
                            <p class="stat-value" id="statWeek">68</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-content">
                            <p class="stat-label">Pendientes</p>
                            <p class="stat-value" id="statPending">5</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-content">
                            <p class="stat-label">Ingresos del Día</p>
                            <p class="stat-value" id="statRevenue">$1,240</p>
                        </div>
                    </div>
                </div>
                
                <!-- Calendar View -->
                <div class="card">
                    <div class="card-header">
                        <h3>Calendario de Citas</h3>
                        <div class="card-actions">
                            <button class="btn btn-secondary btn-sm">Hoy</button>
                            <button class="btn btn-secondary btn-sm">&lt;</button>
                            <button class="btn btn-secondary btn-sm">&gt;</button>
                        </div>
                    </div>
                    <div class="calendar-container" id="calendarContainer">
                        <!-- Se genera dinámicamente -->
                    </div>
                </div>
                
                <!-- Appointments List -->
                <div class="card">
                    <div class="card-header">
                        <h3>Citas Programadas</h3>
                    </div>
                    <div class="appointments-list" id="appointmentsList">
                        <!-- Se genera dinámicamente -->
                    </div>
                </div>
            </main>
        </div>
    </div>
    
    <!-- Modal Nueva Cita -->
    <div class="modal-overlay" id="newAppointmentModal">
        <div class="modal">
            <div class="modal-header">
                <h2>Nueva Cita</h2>
                <p>Agenda una nueva cita</p>
            </div>
            <div class="modal-body">
                <form id="newAppointmentForm">
                    <div class="form-group">
                        <label>Paciente *</label>
                        <select id="appointmentPatient" class="form-select" required>
                            <option value="">Seleccionar paciente...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Servicio *</label>
                        <select id="appointmentService" class="form-select" required>
                            <option value="">Seleccionar servicio...</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Fecha *</label>
                            <input type="date" id="appointmentDate" required>
                        </div>
                        <div class="form-group">
                            <label>Hora *</label>
                            <input type="time" id="appointmentTime" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Terapeuta</label>
                        <select id="appointmentTherapist" class="form-select">
                            <option value="">Asignar automáticamente</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Notas</label>
                        <textarea id="appointmentNotes" rows="3" placeholder="Notas adicionales..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelAppointment">Cancelar</button>
                <button class="btn btn-primary" id="saveAppointment">Agendar Cita</button>
            </div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/appointments.js"></script>
</body>
</html>
