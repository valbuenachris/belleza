# ============================================================
# backend/alembic.ini - Configuración de Alembic (migraciones)
# ============================================================

[alembic]
# Ruta al directorio de scripts de migración
script_location = alembic

# Template para el nombre de archivos de migración
# Usa timestamp para orden cronológico
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Sistema de archivos para migraciones (timezone-aware)
timezone = UTC

# Prefijo para la tabla de versiones de Alembic
version_table = alembic_version

# Codificación de archivos
output_encoding = utf-8

# URL de conexión (se sobrescribe desde config.py en runtime)
# sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Hooks para formatear código después de generar migraciones
# hooks = black,ruff

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
