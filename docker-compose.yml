# ============================================================
# docker-compose.yml - Sistema de Gestión Integral para SPAs
# Arquitectura Multitenant
# ============================================================
# Base de datos externa configurada mediante .env
# ============================================================

services:

  # ----------------------------------------------------------
  # Backend - FastAPI con Uvicorn/Gunicorn
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spa_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=false
      - ENVIRONMENT=production
      - GOOGLE_WALLET_ENABLED=${GOOGLE_WALLET_ENABLED}
      - GOOGLE_WALLET_ISSUER_ID=${GOOGLE_WALLET_ISSUER_ID}
      - GOOGLE_WALLET_CLASS_ID=${GOOGLE_WALLET_CLASS_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./google-creds/service-account.json:/app/google-credentials/service-account.json:ro
    networks:
      - spa_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ----------------------------------------------------------
  # Frontend - Nginx sirviendo archivos estáticos
  # ----------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: spa_frontend
    ports:
      - "8088:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - spa_network
      - npm_npm_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------
  # Redis 7 - Cache y manejo de sesiones
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: spa_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spa_network
    restart: unless-stopped

# ============================================================
# Redes
# ============================================================
networks:
  spa_network:
    driver: bridge
    name: spa_management_network

  npm_npm_net:
    external: true

# ============================================================
# Volúmenes persistentes
# ============================================================
volumes:
  redis_data:
    driver: local
    name: spa_redis_data

  # El antiguo volumen de MySQL NO se elimina todavía.
  # Se conserva como respaldo hasta confirmar que ya no se necesita.
