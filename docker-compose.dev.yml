# ============================================================
# docker-compose.dev.yml - Override para desarrollo
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ============================================================

services:
  backend:
    # En desarrollo usamos uvicorn con --reload en lugar de gunicorn
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    environment:
      - DEBUG=true
      - ENVIRONMENT=development
      - LOG_LEVEL=debug
    volumes:
      # Montar todo el backend para hot-reload completo
      - ./backend/app:/app/app
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - ./backend/alembic:/app/alembic:ro
      - ./backend/entrypoint.sh:/app/entrypoint.sh:ro
    ports:
      - "8000:8000"
      # Puerto adicional para debugging
      - "5678:5678"

  frontend:
    # Sirve el build de React incluido en la imagen (el frontend legacy
    # que se montaba aquí fue eliminado en la limpieza de código muerto).
    ports:
      - "80:80"

  # MySQL y Redis ya exponen sus puertos en docker-compose.yml base