# ============================================================
# docker-compose.prod.yml - Override para producción
# Uso: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================================

version: '3.8'

services:
  backend:
    # En producción NO se expone el puerto del backend directamente
    # Solo el frontend (Nginx) tiene acceso
    ports: !reset []
    environment:
      - DEBUG=false
      - ENVIRONMENT=production
      - LOG_LEVEL=warning
    # Límites de recursos
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    # Sin volúmenes montados en producción
    volumes: !reset []
    # Logs con rotación
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

  frontend:
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: always

  mysql:
    # NO exponer MySQL en producción
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=1G
      - --max-connections=500
      - --slow-query-log=1
      - --slow-query-log-file=/var/lib/mysql/slow.log
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: always

  redis:
    # NO exponer Redis en producción
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-redis_secure_password}
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: always

  # phpMyAdmin NO se levanta en producción
  phpmyadmin:
    profiles:
      - disabled
